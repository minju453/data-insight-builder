<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="8" />

  <!-- Ambient Light -->
  <circle cx="256" cy="256" r="180" fill="#1e3a8a" opacity="0.3" filter="url(#glow)" />

  <!-- Data Bars -->
  <rect x="120" y="260" width="60" height="110" rx="14" fill="url(#bar1)" />
  <rect x="220" y="195" width="60" height="175" rx="14" fill="url(#bar2)" />
  <rect x="320" y="130" width="60" height="240" rx="14" fill="url(#bar3)" />

  <!-- Trend Curve Line -->
  <path d="M 150 245 Q 240 180 350 115" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  
  <!-- Data Points -->
  <circle cx="150" cy="245" r="12" fill="#ffffff" stroke="#06b6d4" stroke-width="4" />
  <circle cx="250" cy="180" r="12" fill="#ffffff" stroke="#3b82f6" stroke-width="4" />
  <circle cx="350" cy="115" r="12" fill="#ffffff" stroke="#a855f7" stroke-width="4" />

  <!-- AI Sparkle / Star (Top Right) -->
  <path d="M 400 60 Q 400 95 435 95 Q 400 95 400 130 Q 400 95 365 95 Q 400 95 400 60 Z" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="400" cy="95" r="6" fill="#ffffff" />
</svg>
